name: build mono
on:
  workflow_dispatch:
  workflow_run:
    workflows: [build base]
    types: [completed]
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - mono/**

permissions:
  contents: read
  packages: write

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      mono_changed: ${{ steps.filter.outputs.mono_changed || 'false' }}
      base_changed: ${{ steps.filter.outputs.base_changed || 'false' }}
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: ${{ github.event_name == 'push' }}
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mono_changed:
              - 'mono/**'
            base_changed:
              - 'base/**'
              - 'scripts/base/ampstart.sh'

  build_and_push:
    needs: [check_changes]
    if: ${{ github.repository_owner == 'CubeCoders' && github.ref == 'refs/heads/master' && ( (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'push' && needs.check_changes.outputs.mono_changed == 'true' && needs.check_changes.outputs.base_changed != 'true') || github.event_name == 'workflow_dispatch' ) }}
    name: 'ampbase:mono-${{ matrix.mono }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mono: 'latest'
            alias: 'mono'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/build-image
        with:
          file: ./mono/${{ matrix.mono }}/Dockerfile
          tags: |
            cubecoders/ampbase:mono-${{ matrix.mono }}
            ${{ matrix.alias && format('cubecoders/ampbase:{0}', matrix.alias) || '' }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.mono }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.mono }}
          smoke: mono --version && mcs --version
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
