name: build wine
on:
  workflow_dispatch:
  workflow_run:
    workflows: [build base]
    types: [completed]
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - wine/**
      - scripts/wine/**

permissions:
  contents: read
  packages: write

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      wine_changed: ${{ steps.filter.outputs.wine_changed || 'false' }}
      base_changed: ${{ steps.filter.outputs.base_changed || 'false' }}
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: ${{ github.event_name == 'push' }}
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            wine_changed:
              - 'wine/**'
              - 'scripts/wine/**'
            base_changed:
              - 'base/**'
              - 'scripts/base/ampstart.sh'

  build_wine_common:
    needs: [check_changes]
    if: ${{ github.repository_owner == 'CubeCoders' && github.ref == 'refs/heads/master' && ( (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'push' && needs.check_changes.outputs.wine_changed == 'true' && needs.check_changes.outputs.base_changed != 'true') || github.event_name == 'workflow_dispatch' ) }}
    name: 'ampbase:wine-common'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/build-image
        with:
          file: ./wine/common/Dockerfile
          tags: cubecoders/ampbase:wine-common
          cache-from: type=gha,scope=${{ github.workflow }}-common
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-common
          smoke: cabextract --version
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  build_versions:
    needs: [build_wine_common]
    name: 'ampbase:wine-${{ matrix.version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ntsync: rebuilt from WineHQ's source with NTSYNC (see scripts/wine/get-wine-debs.sh)
          - version: 'stable'
            branch: 'stable'
            alias: 'wine'
            ntsync: true
          - version: 'devel'
            branch: 'devel'
            ntsync: true
          - version: 'staging'
            branch: 'staging'
            ntsync: true
          - version: '11-stable'
            branch: 'stable'
            target: '11'
            ntsync: true
          - version: '10-stable'
            branch: 'stable'
            target: '10'
          - version: '9-stable'
            branch: 'stable'
            target: '9'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Two parallel Wine source builds (amd64 + i386) need more room than a stock runner leaves
      - name: free runner disk
        if: ${{ matrix.ntsync }}
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: resolve Wine version
        id: wine
        env:
          WINE_BRANCH: ${{ matrix.branch }}
          WINE_TARGET: ${{ matrix.target }}
        run: echo "build=$(sh scripts/wine/get-wine-debs.sh version)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-image
        with:
          file: ./wine/Dockerfile
          build-args: |
            WINE_BRANCH=${{ matrix.branch }}
            WINE_TARGET=${{ matrix.target }}
            WINE_BUILD=${{ steps.wine.outputs.build }}
          tags: |
            cubecoders/ampbase:wine-${{ matrix.version }}
            ${{ matrix.alias && format('cubecoders/ampbase:{0}', matrix.alias) || '' }}
          cache-from: |
            type=gha,scope=${{ github.workflow }}-common
            type=gha,scope=${{ github.workflow }}-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.version }}
          smoke: |
            wine --version | grep -E '^wine-${{ matrix.target || '[0-9]+' }}\.'
            ${{ matrix.ntsync && 'grep -qa /dev/ntsync /opt/wine-*/bin/wineserver' || 'true' }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
