name: build base
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches:
      - master
    paths:
      - base/**
      - scripts/base/ampstart.sh
permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    if: ${{ github.repository_owner == 'CubeCoders' && github.ref == 'refs/heads/master' }}
    name: 'ampbase:${{ matrix.base }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: 'debian'
            alias: 'latest'
            allow_failure: false
          - base: 'debian-12'
            allow_failure: true
          - base: 'ubuntu'
            allow_failure: false  # redis builds on it
          - base: 'ubuntu-24.04'
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-image
        with:
          file: ./base/${{ matrix.base }}/Dockerfile
          tags: |
            cubecoders/ampbase:${{ matrix.base }}
            ${{ matrix.alias && format('cubecoders/ampbase:{0}', matrix.alias) || '' }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.base }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.base }}
          smoke: locale -a | grep -qi '^en_US\.utf8$' && git --version && jq --version && xvfb-run --help >/dev/null && gdb --version
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
