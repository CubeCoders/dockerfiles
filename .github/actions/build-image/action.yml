name: build image
description: Build an AMP image for amd64, smoke test it, then build and push all platforms

inputs:
  file:
    description: Dockerfile path
    required: true
  tags:
    description: Newline-separated image tags to push
    required: true
  platforms:
    description: Platforms to push
    default: linux/amd64,linux/arm64/v8
  build-args:
    description: Newline-separated build args
    default: ''
  cache-from:
    description: Newline-separated cache sources
    required: true
  cache-to:
    description: Cache destination
    required: true
  smoke:
    description: Extra bash run inside the amd64 image after the common checks
    default: ''
  dockerhub-username:
    required: true
  dockerhub-token:
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.file }}
        platforms: linux/amd64
        load: true
        pull: true
        provenance: false
        tags: ampbase-smoke:local
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}

    - name: smoke test
      shell: bash
      env:
        SMOKE: ${{ inputs.smoke }}
      run: |
        docker run --rm -e SMOKE --entrypoint bash ampbase-smoke:local -c '
          set -euo pipefail
          tini --version
          gosu nobody true
          bash -n /ampstart.sh
          eval "${SMOKE}"
        '

    - uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        push: true
        pull: true
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        provenance: mode=max
        sbom: true
